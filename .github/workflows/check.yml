name: Check
# Every pull request and every commit on main: each version's archive is
# what its entry says (tools/check_registry.py, which fetches each archive
# over the network and needs only Python 3 and `patch`). The Releases
# workflow dispatches it on the branch of each pull request it opens, which
# starts no workflow itself.
#
# On GitHub's own runners (the repository is public): the job holds a
# read-only token and no secrets, so a fork's pull request runs it too.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
# Every run but a pull request's is a group of its own (GitHub keeps one
# pending run a group and cancels the rest); a pull request's newer push
# cancels its older run, so only the head's check runs; main's run to the
# end.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('check-pr-{0}', github.event.pull_request.number) || format('check-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - run: python3 --version && patch --version | head -1
      - run: python3 tools/check_registry.py
